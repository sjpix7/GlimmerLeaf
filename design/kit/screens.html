function stubEntry(first=false){if(first)return card(small('Nov 20, 2026 · 9:41 AM')+'　🙂'+h('One thing for each sense that I am glad of')+p('Sunlight on the wall · Birds outside · A warm cup')+b(ico('trash'),'modal(21)'));return card(small('Nov 20, 2026 · 9:41 AM')+'　😊'+h('Small wins and who or what helped')+p('My teammate helped me finish a difficult task.')+h("This morning’s five thanks")+p('A quiet breakfast.')+b(ico('trash'),'modal(21)'))}
function practice(){let d=D[day-1],title=ix===9?({'Deutsch':'Die Menschen, die das Leben am Laufen halten','हिन्दी':'जीवन को चलाने वाले लोग','日本語':'暮らしを支えてくれる人々','中文':'让生活正常运转的人们','한국어':'일상을 지탱해 주는 사람들'}[$('#stress').value]||'The People Who Keep Life Running'):d.title;let notes=(entries[day]||[]).map(e=>card(small(e.date)+' '+e.mood+e.groups.map(([k,v])=>h(E(k))+p(E(v))).join('')+b(ico('trash'),'modal(21)'))).join('');return chip('DAY '+day+' OF 28 · '+week(day).toUpperCase())+'<h1>'+title+'</h1>'+p('<i>'+d.theme+'</i>')+chip(ix===6?'✓ Completed ×2':ix===8?'Day 4 unlocks tomorrow at 9:00 AM':ix===7?'Upcoming':"Today’s practice")+(ix===7||ix===8?card('This practice is ahead of your schedule. You can still do it now; your journey keeps its order.'):'')+player()+card(d.intro.join(' '),playing==='reading'&&part===0?'pulse':'')+h('The practice')+d.steps.map((s,i)=>card('<b>'+(i+1)+'</b>　'+s,playing==='reading'&&part===i+1?'pulse':'')).join('')+h('Carry this with you')+card('“　<i>'+d.affirmation+'</i>',playing==='reading'&&part===5?'pulse':'hero')+h('Your journal')+small('<span id="saved">'+(drafts[day]?'Draft saved':'')+'</span>')+d.journal.map((j,i)=>field(j.prompt,j.count||1,'p'+i+'-')).join('')+field("This morning’s five thanks",5,'thanks')+h('Reflection')+'<textarea data-key="reflection" placeholder="What did you notice? How do you feel?">'+E(drafts[day]?.reflection||'')+'</textarea>'+h('How do you feel now?')+'<div class="row">'+em.map((e,i)=>b(e,'chooseMood('+i+')',mood===i?'sel':'')).join('')+'</div>'+action(ix===6?'Save another session':'Complete practice','finish()')+h('Your entries for this practice')+(notes||(ix===6?stubEntry():p('No entries yet')))}
function chooseMood(i){mood=i;render()}
function finish(){let d=D[day-1],v=drafts[day]||{},groups=[...d.journal.map((j,i)=>[j.prompt,Object.keys(v).filter(k=>k.startsWith('p'+i+'-')).map(k=>v[k]).join(' · ')]),["This morning’s five thanks",Object.keys(v).filter(k=>k.startsWith('thanks')).map(k=>v[k]).join(' · ')],['Reflection',v.reflection||'']].filter(x=>x[1]);(entries[day]??=[]).unshift({date:new Date().toLocaleString(),mood:em[mood]||'',groups});modal(day===28?20:19)}
function ritual(){let m=ix===10?0:1,r=R[m];return small(r.when)+'<h1>'+r.title+'</h1>'+art(m?'golden-evening':'sunrise')+p(r.text)+player()}
function history(){if(ix===15)return empty('History','no-history','No history yet','Your completed practices will appear here.');return '<h1>History</h1>'+card(h('Journey 2')+chip('In progress')+p('Started Nov 20, 2026')+prog(12,'12 done · 16 left')+p('Sessions: 15')+b(ix===12?'Show days':'Hide days','go('+(ix===12?13:12)+')')+b(ico('share'),"toast('Share journey as text')")+b(ico('trash'),'modal(21)')+(ix>=13?Array.from({length:12},(_,i)=>btn('Day '+(i+1)+' · '+D[i].title+'<br>'+small(i?'Sessions: 1':'Sessions: 1 · 3 notes'),'go(14)')+(i===0&&ix===14?stubEntry(true):'')+b(ico('trash'),'modal(21)')).join(''):''))+card(h('Journey 1')+chip('Completed')+p('Started Nov 20, 2026 · Ended Dec 18, 2026')+prog(28,'28 done · 0 left'))}
function empty(title,img,head,copy){return '<h1>'+title+'</h1>'+card(art(img)+h(head)+p(copy))}
function insights(){if(ix===17)return empty('Insights','no-insights','No insights yet','Complete a practice to see your progress.');return '<h1>Insights</h1>'+card(h('This journey · Journey 1')+'<div class="ring"><b>43%</b></div>'+p('12 / 28')+p('15 sessions · 42 notes written')+h('Sessions per practice')+'<div class="bars">'+Array.from({length:28},(_,i)=>'<i style="height:'+(i<12?(i%4===0?90:45):2)+'%;background:var(--'+(i===12?'accent':'muted')+')"></i>').join('')+'</div>'+small('1　　　 7　　　 14　　 21　　 28'))+h('All time')+'<div class="grid">'+['Current streak|1 day','Best streak|12 days','Sessions|15','Notes written|42'].map(x=>card(small(x.split('|')[0])+p(x.split('|')[1]))).join('')+'</div>'+p('Journeys completed · 0')+card(h('12-week activity')+'<div class="heat">'+Array.from({length:84},(_,i)=>'<i style="background:var(--'+(i>60&&i%3?'accent':'surfaceAlt')+')"></i>').join('')+'</div>')+card(h('Mood after practice')+'<svg viewBox="0 0 240 68" role="img" aria-label="Last four moods: neutral, happy, calm, delighted"><path d="M4 54L78 21 155 37 236 6" fill="none" stroke="var(--accent)" stroke-width="3"/></svg>'+small('😐　→　😊　→　🙂　→　🤩'))}
function settings(){return '<h1>Settings</h1>'+card(h('Appearance')+'<div class="swatches">'+Object.keys(themes).map((t,i)=>b('<i style="background:'+themes[t].day.accent+'"></i>'+t,'setTheme('+i+')',theme===t?'current':'')).join('')+'</div>'+btn('Night mode · '+(night?'On':'Off'),'flip()'))+card(h('Language')+btn(lang,'modal(23)'))+card(h('Reading voice')+['Female','Male'].map(v=>b(v,"voice='"+v+"';render()",voice===v?'sel':'')).join('')+btn('Specific voice','modal(24)')+p('Reading speed · <output>'+speed.toFixed(2)+'×</output>')+'<input type="range" aria-label="Reading speed" min=".5" max="1.5" step=".05" value="'+speed+'" oninput="speed=+this.value;document.querySelector(\'output\').value=speed.toFixed(2)+\'×\'">'+btn('Test voice',"toast('Voice preview')")+btn('Install or manage voices',"toast('Android voice settings handoff')"))+card(h('Reminders')+btn('Reminders · '+(rem?'On':'Off'),'rem=!rem;render()')+Object.keys(times).map(k=>btn(k+' · '+times[k],"timeKind='"+k+"';modal(25)")).join('')+h('Repeat every')+[1,2,3,4,6].map(v=>b(v+' h','interval='+v+';render()',v===interval?'sel':'')).join('')+btn('Exact reminder times · '+(exact?'Allowed':'Not allowed. Tap to allow'),'exact=!exact;render()')+h('Next practice unlocks')+['Next morning','Right after completing'].map(v=>b(v,"unlock='"+v+"';render()",v===unlock?'sel':'')).join(''))+card(h('Journey')+p('Reset this journey to start again. Its history is kept as Reset.')+b('Reset journey','modal(22)','danger'))+card(h('About')+p('Glimmerleaf')+small('Version 1.0.0')+p('28 days to notice what is good')+ico('heart')+' '+credit)}
function flip(){night=!night;render()}function setTheme(i){theme=Object.keys(themes)[i];render()}function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,1800)}
function modal(n){let el=$('dialog');if(el.open)el.close();let close="document.querySelector('dialog').close()";let msg=n===19||n===20?'<div class="confetti">✧ ✦ ✧</div>'+h(n===19?'Wonderful!':'Congratulations!')+p(n===19?'You completed Day '+day+': '+D[day-1].title:'You have completed the whole 28-day journey!')+p('<i>'+D[day-1].affirmation+'</i>')+action('Continue',close+';go('+(n===19?2:3)+')'):n===21||n===22?h(n===21?'Delete this item?':'Reset journey?')+p(n===21?'This removes the selected item and its entries from this phone.':'Archive the current journey as Reset and return to Today.')+b('Cancel',close)+b(n===21?'Delete':'Reset journey',close+(n===22?';go(0)':";toast('Item deleted')"),'danger'):n===23?h('Choose language')+langs.map((v,i)=>btn((v===lang?'● ':'○ ')+v,'lang=langs['+i+'];'+close+';render()')).join(''):n===24?h('Choose voice')+['System default','Voice 1','Voice 2'].map((v,i)=>btn('◯ '+v,"this.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));this.classList.add('sel');toast('Voice preview')")).join('')+btn('Done',close):h(timeKind)+'<input id="clock" aria-label="Reminder time" type="time" value="'+times[timeKind]+'">'+btn('Save',"times[timeKind]=document.querySelector('#clock').value;"+close+';render()');el.innerHTML=msg;el.showModal()}
function render(){tone();device.classList.toggle('large',parseInt($('#scale').value)>100);$('#state').value=ix;let isInner=ix>=5&&ix<=11;$('#top').innerHTML=(isInner?b(ico('back'),'go(1)'): '<img src="svg/brand/symbol-light.svg" alt="Glimmerleaf">')+'<span class="credit">'+credit+'</span>'+b('<span class="toggle '+(night?'night':'')+'"><i>'+(night?'☾':'☀')+'</i></span>','flip()');$('main').innerHTML=ix<4?today():ix===4?contents():ix<=9?practice():ix<=11?ritual():ix<=15?history():ix<=17?insights():ix===18?settings():ix===27?card(small('Glimmerleaf · 9:41')+h('Day 3 · Small Wins')+p('Your gratitude practice is waiting. A few minutes is all it takes.')):ix>=21?settings():practice();$('nav').innerHTML=['Today','Contents','History','Insights','Settings'].map((s,i)=>b('<span>'+ico(['home','book','history','chart','gear'][i])+'</span>'+(i===4&&$('#stress').value==='Deutsch'?'Einstellungen':i===3&&$('#stress').value==='Русский'?'Статистика':s),'go('+[1,4,12,16,18][i]+')',i===(ix<4?0:ix<=11?1:ix<=15?2:ix<=17?3:4)?'active':'')).join('');document.querySelectorAll('button:has(.ico)').forEach(el=>{if(!el.textContent.trim())el.setAttribute('aria-label',el.querySelector('svg')?.dataset.name||'Playback control')})}
$('#state').innerHTML=states.map((s,i)=>'<option value="'+i+'">'+s+'</option>').join('');$('#state').onchange=e=>{let n=+e.target.value;go(n);if(n>=19&&n<=25)modal(n);if(n===26)toast('Draft saved')};$('#size').onchange=e=>$('#device').style.width=parseInt(e.target.value)+'px';$('#scale').onchange=e=>$('#device').style.fontSize=(parseInt(e.target.value)+'%',(device.classList.toggle('large',parseInt(e.target.value)>100),e.target.value));$('#stress').onchange=()=>go(9);$('main').oninput=e=>{if(e.target.dataset.key){(drafts[day]??={})[e.target.dataset.key]=e.target.value;$('#saved').textContent='Draft saved'}};document.addEventListener('focusin',e=>{if(e.target.matches('main input:not([type=range]),main textarea'))$('nav').style.display='none'});document.addEventListener('focusout',()=>{$('nav').style.display=''});render();
